# Installed by eos-cosmic-setup (module vesktop-mic).
#
# Vesktop (Chromium/WebRTC) runs an automatic gain control that keeps turning
# the system microphone volume down. block-source-volume makes PipeWire ignore
# those volume changes from the matched clients.
#
# To cover another app that does the same, add one more line inside matches,
# using the binary name from:
#   pactl list source-outputs | grep application.process.binary
pulse.rules = [
    {
        matches = [
            { application.process.binary = "vesktop" }
        ]
        actions = { quirks = [ block-source-volume ] }
    }
]
